[project]
name = "tenantflow"
version = "1.0.0"
description = "Multi-Tenant Data Orchestration Platform Powered by Apache Airflow, PySpark Core, and Declarative Config DSL"
authors = [{ name = "Pruthvi Nag Gattu", email = "gattupruthvinag5@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyspark>=3.5.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "streamlit>=1.33.0",
    "plotly>=5.20.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.5",
    "mypy>=1.9.0",
]

[project.scripts]
tenantflow = "tenantflow.cli:cli"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
